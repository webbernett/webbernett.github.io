<!DOCTYPE HTML>
<html>
	<head>
		<title>Alexander White - Portfolio</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

		<style>
			/* Zelda Game Wrapper (Full Size) */
			.game-wrapper-large {
				position: relative;
				width: 100%;
				max-width: 1024px;
				margin: 2em auto;
				padding-bottom: 93.75%;
				height: 0;
				overflow: hidden;
				background: #000;
				border-radius: 4px;
				box-shadow: 0 0 50px rgba(0,0,0,0.5);
			}

			/* Bottle Boy Wrapper (2/3 Height) */
			.game-wrapper-small {
				position: relative;
				width: 100%;
				max-width: 1024px;
				margin: 2em auto;
				padding-bottom: 62%;
				height: 0;
				overflow: hidden;
				background: #000;
				border-radius: 4px;
				box-shadow: 0 0 50px rgba(0,0,0,0.5);
			}

			.game-wrapper-large iframe,
			.game-wrapper-small iframe {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				border: none;
			}

			.volume-btn {
				display: inline-block;
				margin-top: 1em;
				padding: 0.6em 1.2em;
				background: #444;
				color: #fff;
				border: none;
				border-radius: 4px;
				cursor: pointer;
			}

			.volume-btn:hover {
				background: #666;
			}

			#unity-fullscreen-button {
				display: none !important;
				visibility: hidden !important;
			}
		</style>
	</head>

	<body class="is-preload">

		<div id="wrapper">

			<!-- ZELDA -->
			<section class="wrapper style1 fullscreen fade-up">
				<div class="inner">
					<h2>Zelda Recreation</h2>

					<div id="unity-fullscreen-button"></div>

					<div class="game-wrapper-large">
						<iframe id="zelda-iframe" src="zelda/game.html" scrolling="no"></iframe>
					</div>

					<button class="volume-btn" onclick="toggleAudio('zelda')">
						Unmute
					</button>
				</div>
			</section>

			<!-- BOTTLE BOY -->
			<section class="wrapper style1 fade-up">
				<div class="inner">
					<h2>Bottle Boy</h2>

					<div class="game-wrapper-small">
						<iframe id="bottleboy-iframe" src="bottleboy/bottleboy.html" scrolling="no"></iframe>
					</div>

					<button class="volume-btn" onclick="toggleAudio('bottleboy')">
						Unmute
					</button>
				</div>
			</section>

		</div>

		<script>
			let audioState = {
				zelda: false,
				bottleboy: false
			};

			function toggleAudio(game) {
				const iframe = document.getElementById(game + "-iframe");
				const button = event.target;

				audioState[game] = !audioState[game];

				if (audioState[game]) {
					button.innerText = "Mute";
				} else {
					button.innerText = "Unmute";
				}

				// Send message to Unity (requires Unity-side handler)
				if (iframe && iframe.contentWindow) {
					iframe.contentWindow.postMessage({
						type: "TOGGLE_AUDIO",
						muted: !audioState[game]
					}, "*");
				}
			}

			// Default both games to muted on load
			window.onload = function() {
				const zeldaFrame = document.getElementById('zelda-iframe');
				const bottleFrame = document.getElementById('bottleboy-iframe');

				if (zeldaFrame && zeldaFrame.contentWindow) {
					zeldaFrame.contentWindow.postMessage({ type: "TOGGLE_AUDIO", muted: true }, "*");
				}

				if (bottleFrame && bottleFrame.contentWindow) {
					bottleFrame.contentWindow.postMessage({ type: "TOGGLE_AUDIO", muted: true }, "*");
				}
			};
		</script>

	</body>
</html>
